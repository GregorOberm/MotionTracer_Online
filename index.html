<!DOCTYPE html>
<html lang="de">

<head>
  <script src="https://cdn.plot.ly/plotly-4.1.0.min.js" charset="utf-8"></script>
  <script src="drawLines.js" defer></script>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="mystyle.css">

  <!-- Verhindert das Speichern im Cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">


  <link rel="icon" type="image/x-icon" href="./logo.ico">
</head>

<body>

  <container>
    <h1>MotionTracer</h1>
    <br>

    <br>
  </container>


  <div class="card">

    <button id="connectButton">
      Connect to sensor
    </button>
    <button id="startButton" onclick="startButtonClicked()">Messung starten</button>

    <button id="selectLineButton" onclick="selectLineButtonClicked()">Linie auswählen</button>


    <div id="myPlot" class="plotly-container"></div>
    <div>
      <table>
        <tr>
          <td>
            <label id="label-ymax-input" for="ymax-input" hidden>Y-Achse Maximum:</label>
            <input type="number" id="ymax-input" value="100" step="any" hidden>
          </td>
          <td>
            <label id="label-xmax-input" for="xmax-input" hidden>X-Achse Maximum:</label>
            <input type="number" id="xmax-input" value="10" step="any" hidden>
          </td>
        </tr>
      </table>
    </div>
  </div>




  <div id="messages">
    <p id="message"> </p>
    <p id="statusInfo"> </p>
  </div>

  <details>
    <summary>Empfangene Daten</summary>

    <table>
      <thead>
        <tr>
          <th>Zeit / [s]</th>
          <th>Position / [cm]</th>
          <th><button class="btn-copy" id="copyBtn" onclick="copyTableToClipboard('receivedData')">
              Daten kopieren
            </button>
          </th>
          <!-- Beginn zur Auswahl des Dezimaltrennzeichens (Punkt oder Komma)
          <th>
            <p>Verwendetes Komma: </p>
            <input type="radio" id="dot" name="decimal" value="dot" checked>
            <label for="dot">Punkt</label><br>
            <input type="radio" id="comma" name="decimal" value="comma">
            <label for="comma">Komma</label>

          </th>
        -->
        </tr>
      </thead>
      <tbody id="receivedData">

      </tbody>
    </table>
  </details>

  <!--<a href="instructions.html" target="_blank" class="btn">Anleitung zum Erstellen</a>
  -->
</body>

<footer>
  <p>Gregor Obermüller, 2026, Test</p>
</footer>

</html>



<!-- Das Popup-Modal -->
<dialog id="myModal" class="popup-modal">
  <div class="popup-header">
    <h3>Bitte wähle eine Kurve aus:</h3>
    <button class="close-btn" onclick="document.getElementById('myModal').close()">&times;</button>
  </div>

  <div class="button-grid">
    <!-- 9 Bild-Buttons -->
    <button class="image-btn" onclick="drawLine1(document.getElementById('myPlot'))">
      <img src="img/Kurve1.png" alt="Option 1">
    </button>
    <button class="image-btn" onclick="drawLine2(document.getElementById('myPlot'))">
      <img src="img/Kurve2.png" alt="Option 2">
    </button>
    <button class="image-btn" onclick="drawLine3(document.getElementById('myPlot'))">
      <img src="img/Kurve3.png" alt="Option 3">
    </button>
    <button class="image-btn" onclick="drawLine4(document.getElementById('myPlot'))">
      <img src="img/Kurve4.png" alt="Option 4">
    </button>
    <button class="image-btn" onclick="drawLine5(document.getElementById('myPlot'))">
      <img src="img/Kurve5.png" alt="Option 5">
    </button>
    <button class="image-btn" onclick="drawLine6(document.getElementById('myPlot'))">
      <img src="img/Kurve6.png  " alt="Option 6">
    </button>
    <button class="image-btn" onclick="drawLine7(document.getElementById('myPlot'))">
      <img src="img/Kurve7.png" alt="Option 7">
    </button>
    <button class="image-btn" onclick="drawLine8(document.getElementById('myPlot'))">
      <img src="img/Kurve8.png" alt="Option 8">
    </button>
    <button class="image-btn" onclick="drawLine9(document.getElementById('myPlot'))">
      <img src="img/Kurve9.png" alt="Option 9">
    </button>
  </div>
</dialog>
