<!DOCTYPE html>
<!DOCTYPE html>
<html lang="de">

<head>
    <link rel="stylesheet" href="mystyle.css">
    <script src="instructions.js" defer></script>
    <script src="load-footer.js" defer></script>

</head>

<body>
    <h1>Anleitung zum Erstellen (in Arbeit)</h1>

    <div class="card instructions-card">
        <container class="steps">
            <table id="stepTable">
                <thead>
                    <tr>
                        <th><h2 id="actualStep">Schritt 1</h2></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="stepTableBody">
                    <tr>
                    <td class="stepContentImageRow"><p id="stepContentImage"></p></td>
                    <td class="stepContentTextRow"><div id="stepContentText"></div></td>
                    </tr>
                </tbody>
            </table>
            

            
            
        </container>
        
        <div class="instruction-actions">
            <button id="previousStepButton" type="button" onclick="previousStepButtonClicked()">Vorheriger Schritt</button>
            <button id="nextStepButton" type="button" onclick="nextStepButtonClicked()">Nächster Schritt</button>
        </div>
    </div>

    <div id="site-footer"></div>
</body>
